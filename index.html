<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hormar Driver App</title><style>:root{font-family:system-ui,Arial;background:#eaf0f6;color:#15243a}*{box-sizing:border-box}body{margin:0}.app{max-width:430px;min-height:100dvh;margin:auto;background:white;padding-bottom:75px}header{background:#14263e;color:white;padding:20px;font-weight:750;display:flex;justify-content:space-between}main{padding:18px}h2{margin:4px 0 14px}.muted{color:#68768b;font-size:13px}.card{border:1px solid #dce3ed;border-radius:13px;padding:15px;margin:12px 0}.soft{background:#f2f6fa}.btn{background:#1965c9;color:white;border:0;border-radius:9px;padding:12px 14px;cursor:pointer;font-weight:650}.btn.secondary{background:#e8eef6;color:#15243a}.btn:disabled{opacity:.5}input,textarea,select{width:100%;padding:11px;margin:7px 0 13px;border:1px solid #bdc9d8;border-radius:8px;font:inherit}label{font-size:13px;font-weight:650}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #dce3ed;display:flex;justify-content:space-around}nav button{border:0;background:white;padding:13px 6px;color:#42536b;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{background:#e4f3ed;color:#126b4b;border-radius:12px;padding:5px 8px;font-size:11px}.item{cursor:pointer}.hidden{display:none}small{color:#68768b} .pill{background:#eef3fa;padding:8px;border-radius:8px}</style></head><body><div class="app"><header><span>🚚 HORMAR DRIVER</span><span onclick="show('notifications')" style="cursor:pointer">🔔</span></header><main id="main"></main><nav id="nav"></nav></div><script>
const loads=[{id:'LD-2401',from:'Chicago, IL',to:'Minneapolis, MN',pickup:'Oct 20, 2026',delivery:'Oct 21, 2026',status:'In Transit',broker:'ABC Logistics',truck:'402',pod:false},{id:'LD-2402',from:'Minneapolis, MN',to:'Des Moines, IA',pickup:'Oct 22, 2026',delivery:'Oct 23, 2026',status:'Assigned',broker:'Midwest Freight',truck:'402',pod:false}];const past=[{id:'LD-2388',from:'Madison, WI',to:'Chicago, IL',pod:true},{id:'LD-2376',from:'Omaha, NE',to:'Minneapolis, MN',pod:true}];const docs=[{id:'safety',name:'Driver Safety Policy',type:'Sign',done:false},{id:'cdl',name:'CDL Front & Back',type:'Upload',done:false},{id:'medical',name:'Medical Certificate',type:'Upload',done:false},{id:'agreement',name:'Driver Pay Agreement',type:'Sign',done:false}];const statements=[{period:'Oct 12 – Oct 18, 2026',gross:8500,rate:30,ded:150,status:'Paid'},{period:'Oct 5 – Oct 11, 2026',gross:9200,rate:30,ded:200,status:'Paid'}];let page='home',selected=0,selectedDoc=0,step=1,app={},applicationSubmitted=false,logged=true;const el=document.getElementById('main'),nav=document.getElementById('nav');const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});const card=(s)=>`<div class="card">${s}</div>`;function show(p){page=p;render()}function load(i){selected=i;show('detail')}function documentOpen(i){selectedDoc=i;show('docdetail')}function updateStatus(v){loads[selected].status=v;render()}function submitPOD(){const f=document.getElementById('podfile');if(!f.files.length)return alert('Choose a POD photo or PDF first');loads[selected].pod=true;loads[selected].status='Delivered';alert('POD saved in this demo. Connect backend for real upload.');show('loads')}function submitDoc(){let d=docs[selectedDoc];if(d.type==='Sign'){if(!document.getElementById('signature').value.trim()||!document.getElementById('agree').checked)return alert('Enter signature and consent')}else if(!document.getElementById('docfile').files.length)return alert('Select a file');d.done=true;show('documents')}function nextApp(){for(const i of document.querySelectorAll('[data-field]'))app[i.dataset.field]=i.value;if(step<4){step++;render()}else{if(!app.name||!app.cdl||!document.getElementById('certify').checked)return alert('Complete name, CDL and certification');applicationSubmitted=true;render()}}function render(){if(!logged){el.innerHTML='<h2>Driver Sign In</h2><label>Email</label><input placeholder="driver@hormar.com"><label>Password</label><input type="password"><button class="btn" onclick="logged=true;show(\'home\')">Sign In (Demo)</button>';nav.innerHTML='';return}let h='';if(page==='home'){h='<h2>Welcome, Driver</h2><p class="muted">Hormar Transport · Mobile Portal</p>'+card('<div class="row"><b>Assigned Loads</b><b>2</b></div><div class="row"><b>Document Requests</b><b>'+docs.filter(d=>!d.done).length+'</b></div>')+'<h3>Current Load</h3>'+card('<b>'+loads[0].id+'</b><p>'+loads[0].from+' → '+loads[0].to+'</p><p class="muted">'+loads[0].status+'</p><button class="btn" onclick="load(0)">View Load</button>')+'<h3>Quick Actions</h3>'+['loads|Assigned Loads','documents|Documents','application|Hiring Application','statements|My Statements'].map(x=>{let [p,t]=x.split('|');return `<button class="btn secondary" style="margin:4px" onclick="show('${p}')">${t}</button>`}).join('')}else if(page==='loads'){h='<h2>Assigned Loads</h2>'+loads.map((l,i)=>card(`<div class="row"><b>${l.id}</b><span class="tag">${l.status}</span></div><p>${l.from} → ${l.to}</p><p class="muted">Pickup: ${l.pickup}<br>Delivery: ${l.delivery}</p><button class="btn" onclick="load(${i})">View Details</button>`)).join('')}else if(page==='detail'){let l=loads[selected];h=`<button class="btn secondary" onclick="show('loads')">← Loads</button><h2>${l.id}</h2>`+card(`<p><b>Pickup:</b> ${l.from}<br>${l.pickup}</p><p><b>Delivery:</b> ${l.to}<br>${l.delivery}</p><p><b>Broker:</b> ${l.broker}</p><p><b>Truck:</b> ${l.truck}</p>`)+`<label>Load Status</label><select onchange="updateStatus(this.value)">${['Assigned','At Pickup','Loaded','In Transit','At Delivery','Delivered'].map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="show('pod')">Submit POD</button>`}else if(page==='pod'){h='<h2>Submit POD</h2><p>Load '+loads[selected].id+'</p><label>Signed POD (image or PDF)</label><input id="podfile" type="file" accept="image/*,.pdf" capture="environment"><button class="btn" onclick="submitPOD()">Submit POD</button><p class="muted">Demo keeps only submission status in memory. It does not upload files.</p>'}else if(page==='history'){h='<h2>Load History</h2>'+past.map(l=>card(`<b>${l.id}</b><p>${l.from} → ${l.to}</p><span class="tag">POD Filed</span>`)).join('')+loads.filter(l=>l.status==='Delivered').map(l=>card(`<b>${l.id}</b><p>${l.from} → ${l.to}</p><span class="tag">${l.pod?'POD Submitted':'Missing POD'}</span>`)).join('')}else if(page==='statements'){h='<h2>My Statements</h2>'+statements.map((s,i)=>card(`<div class="row"><b>${s.period}</b><span class="tag">${s.status}</span></div><h3>${money(s.gross*s.rate/100-s.ded)}</h3><button class="btn secondary" onclick="selected=${i};show('statement')">View Statement</button>`)).join('')}else if(page==='statement'){let s=statements[selected];h='<button class="btn secondary" onclick="show(\'statements\')">← Statements</button><h2>Statement</h2>'+card(`<p>${s.period}</p><p>Truck gross: ${money(s.gross)}</p><p>Driver rate: ${s.rate}%</p><p>Driver gross: ${money(s.gross*s.rate/100)}</p><p>Deductions: ${money(s.ded)}</p><h3>Net Pay: ${money(s.gross*s.rate/100-s.ded)}</h3><span class="tag">${s.status}</span>`)+'<p class="muted">PDF downloads require published files from Accounting.</p>'}else if(page==='documents'){h='<h2>Document Requests</h2><p class="muted">Documents pushed by carrier</p>'+docs.map((d,i)=>card(`<div class="row"><b>${d.name}</b><span class="tag">${d.done?'Submitted':d.type+' Required'}</span></div><p><button class="btn secondary" onclick="documentOpen(${i})">Open</button></p>`)).join('')}else if(page==='docdetail'){let d=docs[selectedDoc];h=`<button class="btn secondary" onclick="show('documents')">← Documents</button><h2>${d.name}</h2>`+(d.done?card('✓ Submitted (demo)'):d.type==='Sign'?'<div class="card">Carrier document preview will appear here once connected.</div><label>Type full legal name</label><input id="signature"><label><input id="agree" type="checkbox" style="width:auto"> I agree to sign electronically</label><p><button class="btn" onclick="submitDoc()">Sign & Submit</button></p>':'<label>Upload requested document</label><input id="docfile" type="file" accept="image/*,.pdf"><button class="btn" onclick="submitDoc()">Submit Document</button>')}else if(page==='application'){h=`<h2>Hiring Application</h2><p class="muted">Step ${step} of 4 · Simplified demo</p>`;if(applicationSubmitted)h+=card('✓ Application marked submitted in demo.');else{const field=(key,label)=>`<label>${label}</label><input data-field="${key}" value="${(app[key]||'').replaceAll('"','&quot;')}">`;if(step===1)h+=field('name','Full legal name')+field('phone','Phone')+field('address','Address');if(step===2)h+=field('cdl','CDL number')+field('state','Issuing state');if(step===3)h+=field('employer','Previous employers')+field('history','Accident / violation history');if(step===4)h+=`<p>Name: ${app.name||'Not entered'}</p><p>CDL: ${app.cdl||'Not entered'}</p><label><input type="checkbox" id="certify" style="width:auto"> I certify this information is accurate</label><p class="muted">A real FMCSA application requires additional fields and signature controls.</p>`;h+=`<div class="row">${step>1?'<button class="btn secondary" onclick="step--;render()">Back</button>':''}<button class="btn" onclick="nextApp()">${step===4?'Submit Demo':'Save & Continue'}</button></div>`}}else if(page==='more'){h='<h2>More</h2>'+['documents|Document Requests','application|Hiring Application','statements|Statements','notifications|Notifications','profile|Profile'].map(x=>{let [p,t]=x.split('|');return card(`<button class="btn secondary" onclick="show('${p}')">${t} →</button>`)}).join('')}else if(page==='notifications'){h='<h2>Notifications</h2>'+card('New load assigned · LD-2402')+card('Statement available · Oct 12–18')+card('Document signature requested · Safety Policy')}else if(page==='profile'){h='<h2>My Profile</h2>'+card('<b>Hormar Transport</b><p>Assigned truck: 402</p><p>Role: Driver</p>')+'<button class="btn secondary" onclick="logged=false;render()">Sign Out</button>'}el.innerHTML=h;nav.innerHTML=[['home','⌂ Home'],['loads','🚚 Loads'],['history','◷ History'],['statements','＄ Pay'],['more','☰ More']].map(([p,t])=>`<button style="${page===p?'font-weight:bold;color:#1965c9':''}" onclick="show('${p}')">${t}</button>`).join('')}render();
</script></body></html>
